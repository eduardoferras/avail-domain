services:
  redis:
    container_name: avail-domain-redis
    image: redis:8.4.0-alpine3.22
    ports:
      - 6379:6379

  db:
    image: postgres:18.1
    container_name: avail-domain-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data_avail_domain:/var/lib/postgresql
    ports:
      - 5432:5432

  api:
    build:
      dockerfile: Dockerfile
    container_name: avail-domain-api
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - 8000:8000
    depends_on:
      - db
      - redis

volumes:
  postgres_data_avail_domain:
